<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>hhhhhhhh yyyyyyyyy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --gold: #d4af37;
            --deep-navy: #060810;
            --bg-glow: rgba(212, 175, 55, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            min-height: 100%; font-family: 'Amiri', serif;
            background-color: var(--deep-navy); color: #e0e0e0; overflow-x: hidden;
            padding-top: 80px;
        }

        .mythic-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 30% 20%, #1c0f1e 0%, #050307 100%),
                        radial-gradient(circle at 70% 80%, #0c180f 0%, #030503 100%);
            overflow: hidden;
        }

        .glow-orb {
            position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.5;
            animation: float 20s infinite ease-in-out;
        }
        .orb-jupiter { width: 50vw; height: 50vw; background: rgba(210, 105, 30, 0.4); top: -10%; left: -10%; }
        .orb-saturn { width: 45vw; height: 45vw; background: rgba(238, 232, 170, 0.3); bottom: -10%; right: -10%; animation-delay: -5s; }
        .orb-mars { width: 35vw; height: 35vw; background: rgba(178, 34, 34, 0.35); top: 30%; right: -10%; animation-delay: -10s; }
        .orb-venus { width: 40vw; height: 40vw; background: rgba(255, 215, 0, 0.25); bottom: 10%; left: -5%; animation-delay: -15s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 80px) scale(1.15); }
        }

        .pattern-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, var(--gold) 1px, transparent 1px);
            background-size: 60px 60px; opacity: 0.06; z-index: -1;
        }

        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 25px; background: rgba(6, 8, 16, 0.95);
            border-bottom: 1px solid var(--gold);
        }

        .auth-group { display: flex; gap: 8px; }

        .auth-btn {
            background: rgba(10, 8, 5, 0.9); border: 1px solid var(--gold);
            color: var(--gold); padding: 6px 14px; font-size: 0.8rem;
            border-radius: 3px; cursor: pointer; transition: all 0.3s ease;
            white-space: nowrap; box-shadow: 0 0 5px rgba(212, 175, 55, 0.2);
        }

        .auth-btn:hover {
            background: var(--gold); color: var(--deep-navy);
            box-shadow: 0 0 10px var(--gold); transform: translateY(-1px);
        }

        header { text-align: center; padding: 40px 20px 20px; position: relative; }

        h1 {
            font-size: 3.5rem; color: var(--gold); margin-bottom: 20px;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.8); letter-spacing: 3px;
            animation: gentle-shake 28s infinite ease-in-out;
            display: inline-block; position: relative; font-family: 'Amiri', serif; font-weight: 700;
        }

        .sparkle-dot::after {
            content: ''; position: absolute; top: -5px; right: 35%;
            width: 10px; height: 10px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 20px #fff, 0 0 40px var(--gold);
            animation: publishSparkle 1.5s ease-out forwards; transform: scale(0);
        }

        @keyframes publishSparkle {
            0% { transform: scale(0); opacity: 1; }
            50% { transform: scale(1.8); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        @keyframes gentle-shake {
            0%, 90%, 100% { transform: rotate(0deg); }
            92% { transform: rotate(-1.5deg); }
            94% { transform: rotate(1.5deg); }
            96% { transform: rotate(-1deg); }
            98% { transform: rotate(1deg); }
        }

        .search-wrapper { max-width: 500px; margin: 0 auto; position: relative; }

        input[type="text"] {
            width: 100%; padding: 14px 25px; background: rgba(10, 14, 26, 0.7);
            border: 1.5px solid var(--gold); border-radius: 4px;
            color: white; font-size: 1.1rem; outline: none;
            box-shadow: 0 0 15px var(--bg-glow); transition: all 0.4s ease;
            text-align: center; font-family: 'Cairo', sans-serif;
        }

        input[type="text"]:focus { box-shadow: 0 0 25px var(--gold); background: rgba(10, 14, 26, 0.9); }

        .category-bar { display: flex; justify-content: center; gap: 8px; margin-top: 30px; flex-wrap: wrap; padding: 0 15px; }

        .cat-btn {
            background: rgba(15, 23, 42, 0.8); border: 1px solid var(--gold);
            color: var(--gold); padding: 6px 12px; font-size: 0.9rem;
            border-radius: 3px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: inset 0 0 8px rgba(212, 175, 55, 0.2); white-space: nowrap; font-family: 'Cairo', sans-serif;
        }

        .cat-btn:hover, .cat-btn.active { background: var(--gold); color: var(--deep-navy); box-shadow: 0 0 12px var(--gold); transform: translateY(-1px); }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 8, 16, 0.85); z-index: 2000;
            justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }

        .modal-content {
            position: relative; background: #0c1020; border: 1.5px solid var(--gold);
            padding: 25px; width: 90%; max-width: 500px; border-radius: 6px;
            box-shadow: 0 0 30px var(--gold); color: #fff; text-align: right;
            overflow-y: auto; /* تمكين التمرير العمودي للمحتوى */
            max-height: 90vh; /* تحديد أقصى ارتفاع للنافذة */
        }

        .close-btn {
            position: absolute; top: 10px; left: 15px; font-size: 1.8rem;
            color: var(--gold); cursor: pointer; line-height: 1;
        }
        .close-btn:hover { color: #fff; }

        .modal h3 { color: var(--gold); margin-bottom: 15px; font-size: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.95rem; color: #ccc; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px; background: rgba(10, 8, 5, 0.9);
            border: 1px solid var(--gold); color: #fff; border-radius: 3px; outline: none;
            font-family: 'Cairo', sans-serif; font-size: 0.95rem;
        }

        .submit-btn { width: 100%; padding: 12px; background: var(--gold); border: none; color: var(--deep-navy); font-weight: bold; border-radius: 3px; cursor: pointer; font-size: 1.1rem; transition: 0.3s; font-family: 'Cairo', sans-serif; }
        .submit-btn:hover { background: #fff; box-shadow: 0 0 12px var(--gold); }

        #publishSection {
            display: none; max-width: 550px; margin: 40px auto;
            background: rgba(12, 16, 32, 0.95); border: 1.5px solid var(--gold);
            padding: 30px; border-radius: 8px; color: #fff; position: relative;
            box-shadow: 0 0 25px var(--gold);
        }
        #publishSection h3 { color: var(--gold); text-align: center; margin-bottom: 25px; font-size: 1.8rem; }

        #booksGrid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px; max-width: 1000px; margin: 40px auto; padding: 0 20px;
        }

        .book-card {
            background: rgba(12, 16, 32, 0.8); border: 1px solid var(--gold);
            border-radius: 6px; padding: 15px; text-align: center; position: relative;
            transition: transform 0.3s ease; user-select: none; cursor: pointer;
            display: flex; flex-direction: column; align-items: center;
        }
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .book-card img { width: 150px; height: 220px; object-fit: cover; border-radius: 4px; margin-bottom: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .book-card h4 { color: var(--gold); font-size: 1.4rem; margin-top: auto; font-family: 'Amiri', serif; }

        .context-menu {
            display: none; position: absolute; background: #0c1020;
            border: 1px solid var(--gold); border-radius: 4px; z-index: 1000;
            box-shadow: 0 0 10px var(--gold); width: 120px; text-align: right;
        }
        .context-menu button {
            display: block; width: 100%; padding: 8px 12px; background: none;
            border: none; color: #fff; font-family: 'Cairo', sans-serif; font-size: 0.95rem; cursor: pointer; text-align: right;
        }
        .context-menu button:hover { background: var(--gold); color: var(--deep-navy); }

        .details-modal .modal-content { max-width: 900px; width: 95%; max-height: 90vh; display: flex; flex-direction: column; overflow-y: auto; }
        .book-details-container { display: flex; gap: 20px; margin-bottom: 15px; border-bottom: 1px solid var(--gold); padding-bottom: 15px; position: relative; flex-shrink: 0; }
        .details-modal img { width: 140px; height: 200px; object-fit: cover; border-radius: 4px; box-shadow: 0 0 15px rgba(212, 175, 55, 0.5); }
        .details-info { display: flex; flex-direction: column; justify-content: center; gap: 8px; flex-grow: 1; }
        .pdf-frame { width: 100%; flex-grow: 1; border: none; background: #fff; border-radius: 4px; min-height: 400px; }

        .read-actions-menu {
            position: absolute; bottom: 10px; left: 10px; background: rgba(12, 16, 32, 0.95);
            border: 1px solid var(--gold); border-radius: 20px; padding: 8px 20px;
            display: flex; gap: 20px; box-shadow: 0 0 15px var(--gold);
            animation: shineBorder 2s infinite alternate;
        }
        @keyframes shineBorder {
            0% { box-shadow: 0 0 5px var(--gold); }
            100% { box-shadow: 0 0 20px var(--gold), inset 0 0 10px var(--gold); }
        }
        .read-action-btn {
            background: none; border: none; color: var(--gold); font-family: 'Cairo', sans-serif;
            font-size: 1.1rem; cursor: pointer; transition: 0.3s; padding: 5px 0; font-weight: bold;
        }
        .read-action-btn:hover { color: #fff; text-shadow: 0 0 8px var(--gold); transform: scale(1.1); }

        #downloadsSection {
            max-width: 1000px; margin: 40px auto; padding: 25px; background: rgba(12, 16, 32, 0.95);
            border: 1.5px solid var(--gold); border-radius: 8px; display: none; text-align: center; box-shadow: 0 0 20px var(--gold);
        }
        .download-card-wrapper {
            display: inline-block; position: relative; margin: 20px; width: 190px;
            background: #060810; padding: 15px; border-radius: 6px; border: 1px solid var(--gold);
            text-align: center; vertical-align: top;
        }
        .download-animation-icon {
            position: absolute; top: 10px; left: 10px; font-size: 1.8rem; color: var(--gold);
            animation: bounceDownload 1s infinite alternate;
        }
        @keyframes bounceDownload {
            0% { transform: translateY(0); text-shadow: 0 0 5px var(--gold); }
            100% { transform: translateY(-8px); text-shadow: 0 0 15px #fff; }
        }
        .download-card-wrapper img { width: 120px; height: 170px; object-fit: cover; border-radius: 4px; display: block; margin: 0 auto 10px; box-shadow: 0 0 8px rgba(0,0,0,0.5); }
        .download-card-wrapper h5 { color: var(--gold); font-size: 1rem; margin-top: 5px; font-family: 'Amiri', serif; }
        .dl-btn-group { display: flex; justify-content: space-around; margin-top: 12px; gap: 5px; }
        .dl-mini-btn {
            background: rgba(212, 175, 55, 0.2); border: 1px solid var(--gold); color: var(--gold);
            padding: 6px 12px; font-size: 0.9rem; border-radius: 3px; cursor: pointer; transition: 0.3s; font-family: 'Cairo', sans-serif;
        }
        .dl-mini-btn:hover { background: var(--gold); color: var(--deep-navy); }
    </style>
</head>
<body>

<div class="mythic-bg">
    <div class="glow-orb orb-jupiter"></div>
    <div class="glow-orb orb-saturn"></div>
    <div class="glow-orb orb-mars"></div>
    <div class="glow-orb orb-venus"></div>
</div>
<div class="pattern-overlay"></div>

<div class="top-nav">
    <div class="auth-group">
        <button class="auth-btn" onclick="openModal('readerLoginModal')">تسجيل دخول</button>
        <button class="auth-btn" onclick="alert('تم تسجيل الخروج')">تسجيل خروج</button>
    </div>
    <div class="auth-group">
        <button class="auth-btn" onclick="openModal('authorLoginModal')">تسجيل دخول كاتب</button>
    </div>
</div>

<header>
    <h1 id="mainTitle">ديوان النور</h1>
</header>

<div class="search-wrapper">
    <input type="text" id="searchInput" placeholder="ابحث في عيون الكتب والمخطوطات..." oninput="filterBooks()">
</div>

<nav class="category-bar" id="categoryBar">
    <button class="cat-btn active" onclick="filterByCategory('الكل')">الكل</button>
    <button class="cat-btn" onclick="filterByCategory('نوادر التاريخ')">نوادر التاريخ</button>
    <button class="cat-btn" onclick="filterByCategory('جواهر الشعر')">جواهر الشعر</button>
    <button class="cat-btn" onclick="filterByCategory('فلسفة الفكر')">فلسفة الفكر</button>
    <button class="cat-btn" onclick="filterByCategory('علوم الأولين')">علوم الأولين</button>
    <button class="cat-btn" onclick="filterByCategory('جغرافيا البلدان')">جغرافيا البلدان</button>
    <button class="cat-btn" onclick="filterByCategory('بلاغة البيان')">بلاغة البيان</button>
    <button class="cat-btn" onclick="filterByCategory('روايات وسير')">روايات وسير</button>
    <button class="cat-btn" onclick="filterByCategory('فنون وعمارة')">فنون وعمارة</button>
</nav>

<!-- نافذة تسجيل دخول القارئ -->
<div id="readerLoginModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('readerLoginModal')">&times;</span>
        <h3>تسجيل دخول القارئ</h3>
        <form onsubmit="event.preventDefault(); alert('تم تسجيل الدخول بنجاح'); closeModal('readerLoginModal');">
            <div class="form-group"><label>البريد الإلكتروني</label><input type="email" required placeholder="example@domain.com"></div>
            <div class="form-group"><label>كلمة المرور</label><input type="password" required placeholder="••••••••"></div>
            <button type="submit" class="submit-btn">دخول</button>
        </form>
    </div>
</div>

<!-- نافذة تسجيل دخول الكاتب -->
<div id="authorLoginModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('authorLoginModal')">&times;</span>
        <h3>تسجيل دخول الكاتب</h3>
        <form onsubmit="event.preventDefault(); showPublishSection();">
            <div class="form-group"><label>اسم المستخدم</label><input type="text" required placeholder="اكتب اسمك"></div>
            <div class="form-group"><label>كلمة المرور</label><input type="password" required placeholder="••••••••"></div>
            <button type="submit" class="submit-btn">دخول ونشر</button>
        </form>
    </div>
</div>

<!-- نموذج نشر المخطوطات -->
<div id="publishSection">
    <h3>لوحة نشر المخطوطات</h3>
    <form id="bookForm">
        <div class="form-group"><label>اسم الكتاب</label><input type="text" id="bookTitle" required placeholder="عنوان المخطوطة"></div>
        <div class="form-group"><label>اسم المؤلف</label><input type="text" id="bookAuthor" required placeholder="المؤلف الأصلي"></div>
        <div class="form-group"><label>التصنيف</label>
            <select id="bookCategory" required>
                <option value="نوادر التاريخ">نوادر التاريخ</option>
                <option value="جواهر الشعر">جواهر الشعر</option>
                <option value="فلسفة الفكر">فلسفة الفكر</option>
                <option value="علوم الأولين">علوم الأولين</option>
                <option value="جغرافيا البلدان">جغرافيا البلدان</option>
                <option value="بلاغة البيان">بلاغة البيان</option>
                <option value="روايات وسير">روايات وسير</option>
                <option value="فنون وعمارة">فنون وعمارة</option>
            </select>
        </div>
        <div class="form-group"><label>الشخص الذي شرحه</label><input type="text" id="bookCommentator" placeholder="الشارح"></div>
        <div class="form-group"><label>الشخص الذي دققه</label><input type="text" id="bookEditor" placeholder="المُدقق"></div>
        <div class="form-group"><label>رابط ملف PDF</label><input type="url" id="bookPdf" required placeholder="https://domain.com/book.pdf"></div>
        <div class="form-group"><label>رابط صورة الغلاف</label><input type="url" id="bookCover" required placeholder="https://domain.com/cover.jpg"></div>
        <button type="button" class="submit-btn" onclick="publishBook()">نشر الكتاب</button>
    </form>
</div>

<!-- نافذة عرض تفاصيل الكتاب والـ PDF المضمن -->
<div id="detailsModal" class="modal details-modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('detailsModal')">&times;</span>
        <div id="modalDetailsContent" class="book-details-container"></div>
        <iframe id="pdfIframe" class="pdf-frame"></iframe>
    </div>
</div>

<!-- قسم التنزيلات -->
<div id="downloadsSection">
    <h3 style="color: var(--gold); margin-bottom: 20px;">المخطوطات المُنزلة</h3>
    <div id="downloadsGrid"></div>
</div>

<div id="booksGrid"></div>

<div id="contextMenu" class="context-menu">
    <button onclick="republishBook()">إعادة نشر</button>
    <button onclick="deleteBook()" style="color: #ff4d4d;">حذف</button>
</div>

<script>
let selectedBookElement = null;
let currentFilterCategory = 'الكل';

document.addEventListener('DOMContentLoaded', loadBooksFromStorage);

function openModal(modalId) { document.getElementById(modalId).style.display = 'flex'; }
function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
function showPublishSection() {
    closeModal('authorLoginModal');
    document.getElementById('publishSection').style.display = 'block';
    window.scrollTo({ top: document.getElementById('publishSection').offsetTop - 100, behavior: 'smooth' });
}

function publishBook() {
    const title = document.getElementById('bookTitle').value;
    const author = document.getElementById('bookAuthor').value;
    const category = document.getElementById('bookCategory').value;
    const commentator = document.getElementById('bookCommentator').value;
    const editor = document.getElementById('bookEditor').value;
    const pdf = document.getElementById('bookPdf').value;
    const cover = document.getElementById('bookCover').value;

    if(!title || !author || !pdf || !cover) { alert('يرجى تعبئة الحقول المطلوبة'); return; }

    const bookData = { title, author, category, commentator, editor, pdf, cover, id: Date.now() };
    saveBookToStorage(bookData);
    appendBookToGrid(bookData);

    document.getElementById('bookForm').reset();
    document.getElementById('publishSection').style.display = 'none';
    triggerSparkleEffect();
}

function triggerSparkleEffect() {
    const titleEl = document.getElementById('mainTitle');
    titleEl.classList.add('sparkle-dot');
    setTimeout(() => { titleEl.classList.remove('sparkle-dot'); }, 2000);
}

function appendBookToGrid(book) {
    const grid = document.getElementById('booksGrid');
    const card = document.createElement('div');
    card.className = 'book-card';
    card.dataset.id = book.id;
    card.dataset.category = book.category;
    card.dataset.title = book.title.toLowerCase();
    card.dataset.author = book.author.toLowerCase();

    card.innerHTML = `
        <img src="${book.cover}" alt="غلاف الكتاب">
        <h4>${book.title}</h4>
    `;

    card.onclick = function() { openBookDetails(book); };

    card.oncontextmenu = function(e) {
        e.preventDefault();
        selectedBookElement = card;
        const menu = document.getElementById('contextMenu');
        menu.style.display = 'block';
        menu.style.left = e.pageX + 'px';
        menu.style.top = e.pageY + 'px';
    };

    grid.appendChild(card);
    filterBooks();
}

function openBookDetails(book) {
    const detailsContent = document.getElementById('modalDetailsContent');
    detailsContent.innerHTML = `
        <img src="${book.cover}" alt="غلاف الكتاب">
        <div class="details-info">
            <h3>${book.title}</h3>
            <p><strong>التصنيف:</strong> ${book.category}</p>
            <p><strong>المؤلف:</strong> ${book.author}</p>
            ${book.commentator ? `<p><strong>الشرح:</strong> ${book.commentator}</p>` : ''}
            ${book.editor ? `<p><strong>التدقيق:</strong> ${book.editor}</p>` : ''}
        </div>
        <div class="read-actions-menu">
            <button class="read-action-btn" onclick="event.stopPropagation(); loadBookPdf('${book.pdf}')">قراءة</button>
            <button class="read-action-btn" onclick="event.stopPropagation(); downloadBookCustom('${escape(JSON.stringify(book))}')">تنزيل</button>
        </div>
    `;
    const iframe = document.getElementById('pdfIframe');
    iframe.src = '';
    openModal('detailsModal');
}

function loadBookPdf(pdfUrl) {
    const iframe = document.getElementById('pdfIframe');
    iframe.src = pdfUrl;
}

function downloadBookCustom(encodedBook) {
    const book = JSON.parse(unescape(encodedBook));
    closeModal('detailsModal');
    
    document.getElementById('downloadsSection').style.display = 'block';
    const downloadsGrid = document.getElementById('downloadsGrid');
    
    if(document.getElementById(`dl-${book.id}`)) return;

    const wrap = document.createElement('div');
    wrap.className = 'download-card-wrapper';
    wrap.id = `dl-${book.id}`;
    wrap.innerHTML = `
        <div class="download-animation-icon">↓</div>
        <img src="${book.cover}" alt="الغلاف">
        <h5>${book.title}</h5>
        <div class="dl-btn-group">
            <button class="dl-mini-btn" onclick="openBookDetails(${escape(JSON.stringify(book))})">قراءة</button>
            <button class="dl-mini-btn" onclick="removeDownload(${book.id})">خروج</button>
        </div>
    `;
    downloadsGrid.appendChild(wrap);
}

function removeDownload(id) {
    const el = document.getElementById(`dl-${id}`);
    if(el) el.remove();
    const grid = document.getElementById('downloadsGrid');
    if(grid.children.length === 0) {
        document.getElementById('downloadsSection').style.display = 'none';
    }
}

function saveBookToStorage(book) {
    let books = JSON.parse(localStorage.getItem('libraryBooks') || '[]');
    books.push(book);
    localStorage.setItem('libraryBooks', JSON.stringify(books));
}

function loadBooksFromStorage() {
    let books = JSON.parse(localStorage.getItem('libraryBooks') || '[]');
    books.forEach(appendBookToGrid);
}

function deleteBook() {
    if(selectedBookElement && confirm('هل أنت متأكد من حذف هذه المخطوطة؟')) {
        const bookId = selectedBookElement.dataset.id;
        let books = JSON.parse(localStorage.getItem('libraryBooks') || '[]');
        books = books.filter(b => b.id != bookId);
        localStorage.setItem('libraryBooks', JSON.stringify(books));
        selectedBookElement.remove();
        removeDownload(bookId);
    }
    hideContextMenu();
}

function republishBook() {
    if(selectedBookElement) {
        alert('تمت إعادة تهيئة المخطوطة للصدارة.');
        const grid = document.getElementById('booksGrid');
        grid.insertBefore(selectedBookElement, grid.firstChild);
    }
    hideContextMenu();
}

function hideContextMenu() { document.getElementById('contextMenu').style.display = 'none'; }

function filterByCategory(category) {
    currentFilterCategory = category;
    document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === category);
    });
    applyFilters();
}

function filterBooks() { applyFilters(); }

function applyFilters() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const cards = document.querySelectorAll('.book-card');

    cards.forEach(card => {
        const matchesCategory = (currentFilterCategory === 'الكل' || card.dataset.category === currentFilterCategory);
        const matchesSearch = (card.dataset.title.includes(searchTerm) || card.dataset.author.includes(searchTerm));
        card.style.display = (matchesCategory && matchesSearch) ? 'flex' : 'none';
    });
}

window.onclick = function(event) {
    if (!event.target.matches('.context-menu button')) { hideContextMenu(); }
    if (event.target.classList.contains('modal')) {
        const iframe = document.getElementById('pdfIframe');
        iframe.src = '';
        event.target.style.display = 'none';
    }
};
</script>
